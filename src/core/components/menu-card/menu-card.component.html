<z-card zSize="sm" class="mx-auto w-full max-w-sm cursor-pointer" (click)="menuItemClicked.emit(menuItem().path)">
    <z-card-header>
        <ng-icon [name]="menuItem().icon" size="2rem"></ng-icon>
    </z-card-header>
    <z-card-content>
        <div class="flex flex-col gap-4">
            <span class="text-xl text-bold">{{ menuItem().label }}</span>
            <span>{{ menuItem().description }}</span>
        </div>
    </z-card-content>
</z-card>
