<z-carousel [zOptions]="{ align: 'center', loop: true }" class="pl-4">
    <z-carousel-content>
        @for (cocktail of cocktails(); track cocktail) {
        <z-carousel-item class="basis-1/2 lg:basis-1/5 p-2">
            <app-cocktail-card [cocktail]="cocktail"
                (cocktailClicked)="cocktailClicked.emit(cocktail)"></app-cocktail-card>
        </z-carousel-item>
        }
    </z-carousel-content>
</z-carousel>
